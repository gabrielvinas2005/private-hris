name: Private HRIS CI Pipeline

on:
  push:
    branches: [ main, master, new-hris ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------
  # 1. Frontend Build Verification (ep-frontend)
  # -----------------------------------------------------------
  frontend-build:
    name: Build Frontend (Vue 3 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: private-e-portal/ep-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: private-e-portal/ep-frontend
        run: npm ci

      - name: Test Production Build
        working-directory: private-e-portal/ep-frontend
        run: npm run build

  # -----------------------------------------------------------
  # 2. Backend PHP Syntax & Dependency Verification
  # -----------------------------------------------------------
  backend-lint:
    name: PHP Lint & Composer Check (ep-backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, gd
          coverage: none

      - name: Validate composer.json
        working-directory: private-e-portal/ep-backend
        run: composer validate --strict --no-check-all

      - name: Syntax Lint Backend PHP Files
        run: |
          find private-e-portal/ep-backend/app -type f -name "*.php" -exec php -l {} +
          find private-e-portal/ep-backend/routes -type f -name "*.php" -exec php -l {} +
